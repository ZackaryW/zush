[project]
name = "zush"
version = "0.1.0"
description = "GitHub-backed namespace script launcher"
readme = "README.md"
authors = [
    { name = "ZackaryW", email = "gitzackw@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
zush = "zush:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "behave>=1.3.3",
    "ruff>=0.12.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["src/zush/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ARG", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"features/*/environment.py" = ["F401"]
"features/*/steps/*" = ["F401"]
"features/support/*" = ["S101"]
