[project]
name = "zush"
version = "0.1.0"
description = "GitHub-backed namespace script launcher"
readme = "README.md"
authors = [
    { name = "ZackaryW", email = "gitzackw@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "saucepan-sdk @ git+https://github.com/ZackaryW/saucepan.git@041e4f90634e6007b58054a59604396f8fbebd21#subdirectory=sdk/python",
    "filelock>=3.20,<4",
]

[project.scripts]
zush = "zush:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "behave>=1.3.3",
    "ruff>=0.12.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ARG", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"features/*/environment.py" = ["F401"]
"features/*/steps/*" = ["F401"]
"features/support/*" = ["S101"]
